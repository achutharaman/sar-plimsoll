# Vertex AI list prices in USD, standard PayGo, global endpoint, <=200K input tokens.
# Source: https://cloud.google.com/vertex-ai/generative-ai/pricing (checked 2026-09-13).
# Reasoning ("thinking") tokens are billed as output.
# `promo` applies until its date inclusive; projections should use the standard price.
models:
  gemini-3.8-flash:
    input_per_mtok: 1.50
    output_per_mtok: 7.50
    cached_input_per_mtok: 0.15
    promo:
      until: 2026-12-31
      input_per_mtok: 0.75
      output_per_mtok: 3.75
      cached_input_per_mtok: 0.075
  gemini-3.1-flash-lite:
    input_per_mtok: 0.25
    output_per_mtok: 1.50
    cached_input_per_mtok: 0.025
  gemini-3.1-pro-preview:
    input_per_mtok: 2.00
    output_per_mtok: 12.00
    cached_input_per_mtok: 0.20

embeddings:
  # Gemini Embedding bills input tokens ($0.15 / 1M); legacy text embeddings bill characters.
  gemini-embedding-001:
    per_1k_tokens: 0.00015
  text-embedding-005:
    per_1k_chars: 0.000025

bigquery:
  # On-demand analysis, US multi-region. Queries bill a 10 MB minimum.
  on_demand_per_tib: 6.25
  min_billed_bytes: 10485760
