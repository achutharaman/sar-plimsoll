[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-plimsoll"
version = "0.1.0"
description = "Always-on code reviewer with a deterministic quality score"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.27,<1",
    "python-multipart>=0.0.32",
    "google-genai>=2.23,<3",
    "firebase-admin>=7.5,<8",
    "google-cloud-firestore>=2.30,<3",
    "google-cloud-storage>=3.14,<4",
    "google-cloud-bigquery>=3.45,<4",
    "google-cloud-tasks>=2.24,<3",
    "google-cloud-run>=0.16,<1",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-language-pack>=1.19,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.168,<7",
    "httpx>=0.28,<1",
    "ruff>=0.16,<1",
]

[project.scripts]
plimsoll = "sar_plimsoll.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # ruff format owns line length; long strings and comments are left alone
    "RUF001", "RUF002", "RUF003",  # em-dashes and non-ASCII are expected in rule text
]
