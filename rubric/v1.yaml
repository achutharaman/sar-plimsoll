# Plimsoll rubric v1. Changing any value requires a new version file: the version is part of
# the cache key and is stamped on every review, so old scores stay reproducible.
#
# overall = 1 + 9 * exp(-R / decay),  R = Σ severity_points × dimension_weight
#
# Calibration (decay 8.0):
#   no findings                          → 10.0
#   10 × low formatting        (R=1.0)   →  8.9
#   1 × high correctness       (R=1.95)  →  8.1
#   1 × critical security      (R=4.5)   →  6.1
#   3 × high security          (R=6.75)  →  4.9
#   5 × critical security      (R=22.5)  →  1.5
version: v1

severity_points:
  low: 0.25
  medium: 0.75
  high: 1.5
  critical: 3.0

dimension_weights:
  security: 1.5
  correctness: 1.3
  performance: 1.0
  architecture: 1.0
  maintainability: 0.8
  formatting: 0.4

decay: 8.0

# Findings the model is less sure of than this are still shown but deduct nothing.
min_confidence: 0.3
